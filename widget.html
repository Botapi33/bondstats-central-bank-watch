<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#070a08;color:#e7ece8;font-family:Inter,system-ui,sans-serif}.w{padding:17px 18px;border:1px solid #1c251f}.h{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#71f09a}.u{font-size:8px;color:#68736b}.r{display:grid;grid-template-columns:48px 1fr 82px 75px;gap:10px;align-items:center;border-top:1px solid #1c251f;padding:10px 0}.id{font:9px ui-monospace,monospace;color:#71f09a}.n{font-family:Georgia,serif;font-size:14px}.rate{font-family:Georgia,serif;font-size:17px}.next{font-size:8px;color:#859087;text-align:right}.foot{border-top:1px solid #1c251f;padding-top:10px;font-size:8px;color:#69746c}.foot a{color:#71f09a;text-decoration:none}@media(max-width:420px){.w{padding:13px}.r{grid-template-columns:38px 1fr 70px}.next{display:none}}</style></head><body><div class="w"><div class="h"><div class="k">Central Bank Watch</div><div class="u" id="u">Official sources</div></div><div id="rows"></div><div class="foot">Major policy rates · <a href="https://www.bondstats.org/" target="_blank" rel="noopener">Explore on BondStats ↗</a></div></div><script>const e=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));fetch("data/policy.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{document.getElementById("rows").innerHTML=d.banks.slice(0,5).map(b=>`<div class="r"><div class="id">${e(b.id)}</div><div class="n">${e(b.name)}</div><div class="rate">${e(b.displayRate)}</div><div class="next">${e(b.nextMeetingLabel)}</div></div>`).join("");document.getElementById("u").textContent=new Date(d.meta.lastUpdated).toLocaleDateString("en-GB",{day:"numeric",month:"short"})});</script></body></html>
