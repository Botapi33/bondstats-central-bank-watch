name: Update Central Bank Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: central-bank-watch-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update from official central-bank sources
        run: python scripts/update_policy.py

      - name: Run deterministic tests
        run: python tests/test_policy.py

      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- data/policy.json; then
            echo "Data already current."
            exit 0
          fi

          git config user.name "bondstats-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/policy.json
          git commit -m "Update central bank policy data"
          git push
