<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Bank Watch Health</title><style>
body{background:#080b09;color:#dfe7e1;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;max-width:900px;margin:38px auto;padding:20px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #243027;padding-bottom:16px}.muted{color:#7e8a82}.row{display:grid;grid-template-columns:70px 110px 1fr 150px;gap:12px;padding:13px 0;border-bottom:1px solid #1d2720}.ok{color:#71f09a}.bad{color:#f18484}a{color:#8fc9a1;text-decoration:none}@media(max-width:650px){.row{grid-template-columns:60px 90px 1fr}.checked{display:none}}</style></head><body><div class="top"><div><div class="muted">BONDSTATS / LIVE SOURCE DIAGNOSTICS</div><h1>Central Bank Watch</h1></div><div id="summary">Loading…</div></div><div id="x"></div><script>
fetch("data/policy.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{const rows=d.banks.map(b=>{const st=b.refreshState||"seed";return `<div class="row"><b>${b.id}</b><span class="${st==="degraded"?"bad":"ok"}">${st.toUpperCase()}</span><div><a href="${b.sourceUrl}" target="_blank" rel="noopener">${b.sourceName} ↗</a><div class="muted">${b.displayRate} · next ${b.nextMeetingLabel}</div></div><div class="checked">${b.lastChecked||"seed data"}</div></div>`}).join("");document.getElementById("x").innerHTML=rows;const bad=d.banks.filter(b=>b.refreshState==="degraded").length;document.getElementById("summary").innerHTML=bad?`<span class="bad">${bad} DEGRADED</span>`:`<span class="ok">ALL SOURCES HEALTHY</span>`}).catch(e=>document.getElementById("summary").innerHTML='<span class="bad">FEED FAIL</span>')</script></body></html>
