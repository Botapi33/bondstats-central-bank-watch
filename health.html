<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Bank Watch Health</title><style>body{background:#080b09;color:#dfe7e1;font:14px ui-monospace,monospace;max-width:800px;margin:40px auto;padding:20px}.p{padding:14px 0;border-bottom:1px solid #243027}.ok{color:#71f09a}.bad{color:#f18484}</style></head><body><h1>Central Bank Watch / Health</h1><div id="x">Loading…</div><script>fetch("data/policy.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{let a=[];a.push(["Feed","PASS",d.banks.length+" banks"]);a.push(["Official source flags",d.banks.every(b=>b.status==="official")?"PASS":"FAIL",""]);a.push(["HTTPS sources",d.banks.every(b=>b.sourceUrl.startsWith("https://"))?"PASS":"FAIL",""]);a.push(["Next meetings",d.banks.every(b=>b.nextMeeting)?"PASS":"FAIL",""]);document.getElementById("x").innerHTML=a.map(x=>`<div class="p">${x[0]} — <span class="${x[1]==="PASS"?"ok":"bad"}">${x[1]}</span> ${x[2]}</div>`).join("")}).catch(e=>document.getElementById("x").innerHTML='<span class="bad">FAIL '+e+'</span>')</script></body></html>
